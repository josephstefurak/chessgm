[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
# Legacy engine and training scripts are frozen; they are not linted.
extend-exclude = ["bot.py", "evaluator.py", "features.py", "neural_net.py", "train.py", "train_neural.py"]

[tool.mypy]
files = ["engine", "tools", "tests", "uci.py", "main.py", "match.py"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
